<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAURYA BROWSER</title>
  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-header: #121722;
      --bg-glass: rgba(22, 28, 42, 0.75);
      --bg-glass-hover: rgba(36, 45, 66, 0.85);
      --accent-color: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      --accent-incognito: linear-gradient(135deg, #8a2be2 0%, #4a00e0 100%);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-glow: 0 0 20px rgba(0, 198, 255, 0.25);
      --font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Custom Header Controls */
    #header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      -webkit-app-region: drag;
    }

    .top-titlebar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 14px;
      background: rgba(10, 13, 20, 0.95);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    .brand-logo {
      width: 18px;
      height: 18px;
      background: var(--accent-gradient);
      border-radius: 50%;
      box-shadow: var(--shadow-glow);
    }

    /* Tab Strip */
    .tab-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      flex: 1;
      padding: 0 10px;
      -webkit-app-region: no-drag;
    }

    .tab-strip::-webkit-scrollbar {
      height: 0px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      min-width: 140px;
      max-width: 200px;
      height: 28px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      position: relative;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .tab.active {
      background: var(--bg-glass);
      color: var(--text-main);
      border-color: var(--border-color);
      border-bottom: 2px solid var(--accent-color);
    }

    .tab.incognito.active {
      border-bottom-color: #8a2be2;
    }

    .tab-favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .tab-close {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .tab-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.2);
    }

    .add-tab-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    .add-tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    /* Window Action Buttons */
    .window-controls {
      display: flex;
      align-items: center;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .win-btn.close:hover {
      background: #ff4757;
      color: white;
    }

    /* Navigation Bar */
    .nav-bar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-app-region: no-drag;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      cursor: pointer;
      background: transparent;
      border: none;
      outline: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Omnibox Bar */
    .omnibox-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(10, 13, 20, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0 14px;
      height: 36px;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .omnibox-container:focus-within {
      border-color: #00c6ff;
      box-shadow: 0 0 10px rgba(0, 198, 255, 0.3);
    }

    .security-icon {
      width: 16px;
      height: 16px;
      color: #2ed573;
    }

    .omnibox-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13px;
    }

    .bookmark-star {
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .bookmark-star.active {
      color: #ffa500;
    }

    /* Main Container View Area */
    #main-content {
      flex: 1;
      position: relative;
      background: var(--bg-main);
    }

    /* New Tab Page (NTP) UI */
    .ntp-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a233a 0%, #0a0d14 70%);
      z-index: 10;
      padding: 20px;
    }

    .ntp-logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 3px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .ntp-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .ntp-search-box {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      background: rgba(22, 28, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 12px 20px;
      gap: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .ntp-search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
    }

    .ntp-shortcuts {
      display: flex;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .shortcut-card {
      width: 80px;
      height: 80px;
      background: var(--bg-glass);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .shortcut-card:hover {
      transform: translateY(-4px);
      background: var(--bg-glass-hover);
      border-color: var(--accent-color);
    }

    .shortcut-icon {
      font-size: 24px;
    }

    .shortcut-title {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Modal / Drawer Overlay System */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      width: 500px;
      max-width: 90%;
      background: #121722;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .close-modal {
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-control {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text-main);
      outline: none;
    }

    .preset-btns {
      display: flex;
      gap: 10px;
    }

    .preset-btn {
      flex: 1;
      padding: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
    }

    .preset-btn.active {
      background: var(--accent-gradient);
      border-color: transparent;
    }

    /* Sidebar Drawer */
    .sidebar {
      position: absolute;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100%;
      background: rgba(18, 23, 34, 0.95);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-color);
      transition: right 0.3s ease;
      z-index: 1500;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.03);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .list-item:hover {
      background: rgba(255,255,255,0.08);
    }

    .list-item-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .developer-tag {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      width: calc(100% - 32px);
    }
  </style>
</head>
<body>

  <!-- Header Area -->
  <div id="header">
    <div class="top-titlebar">
      <div class="brand-title">
        <div class="brand-logo"></div>
        SHAURYA BROWSER
      </div>

      <!-- Tab Strip -->
      <div class="tab-strip" id="tab-strip">
        <!-- Dynamic Tabs -->
      </div>

      <div class="add-tab-btn" id="btn-add-tab" title="New Tab (Ctrl+T)">+</div>

      <!-- Window Controls -->
      <div class="window-controls">
        <div class="win-btn" id="btn-min">─</div>
        <div class="win-btn" id="btn-max">□</div>
        <div class="win-btn close" id="btn-close">✕</div>
      </div>
    </div>

    <!-- Navigation Toolbar -->
    <div class="nav-bar">
      <button class="nav-btn" id="btn-back" title="Back">◄</button>
      <button class="nav-btn" id="btn-forward" title="Forward">►</button>
      <button class="nav-btn" id="btn-reload" title="Reload">↻</button>
      <button class="nav-btn" id="btn-home" title="Home">🏠</button>

      <!-- Omnibox -->
      <div class="omnibox-container">
        <svg class="security-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3 3.1-3 1.71 0 3.1 1.29 3.1 3v2z"/>
        </svg>
        <input type="text" class="omnibox-input" id="omnibox" placeholder="Search with Google or enter web address...">
        <span class="bookmark-star" id="btn-bookmark-star" title="Bookmark this page">★</span>
      </div>

      <button class="nav-btn" id="btn-incognito" title="New Private Window">🕵️‍♂️</button>
      <button class="nav-btn" id="btn-downloads" title="Downloads">📥</button>
      <button class="nav-btn" id="btn-sidebar" title="Side Panel">☰</button>
      <button class="nav-btn" id="btn-settings" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- Main View Area -->
  <div id="main-content">
    <!-- New Tab Overlay -->
    <div class="ntp-container" id="ntp-overlay">
      <div class="ntp-logo">SHAURYA</div>
      <div class="ntp-subtitle">Designed & Engineered by Shaurya Mittal</div>

      <div class="ntp-search-box">
        <span>🔍</span>
        <input type="text" class="ntp-search-input" id="ntp-search-input" placeholder="Search the web or type a URL...">
      </div>

      <div class="ntp-shortcuts">
        <div class="shortcut-card" onclick="openUrl('https://google.com')">
          <div class="shortcut-icon">🔍</div>
          <div class="shortcut-title">Google</div>
        </div>
        <div class="shortcut-card" onclick="openUrl('https://youtube.com')">
          <div class="shortcut-icon">▶️</div>
          <div class="shortcut-title">YouTube</div>
        </div>
        <div class="shortcut-card" onclick="openUrl('https://github.com')">
          <div class="shortcut-icon">💻</div>
          <div class="shortcut-title">GitHub</div>
        </div>
        <div class="shortcut-card" onclick="openUrl('https://wikipedia.org')">
          <div class="shortcut-icon">🌐</div>
          <div class="shortcut-title">Wikipedia</div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3 style="color: var(--accent-color)">Quick Center</h3>
        <span style="cursor: pointer" id="close-sidebar">✕</span>
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button class="preset-btn active" id="tab-history">History</button>
        <button class="preset-btn" id="tab-bookmarks">Bookmarks</button>
      </div>
      <div id="sidebar-list" style="flex: 1; overflow-y: auto;">
        <!-- Dynamic Items -->
      </div>
      <div class="developer-tag">SHAURYA BROWSER v1.0.0</div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Browser Settings</div>
        <div class="close-modal" id="close-settings">✕</div>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Default Search Engine</label>
          <select class="form-control" id="setting-search-engine">
            <option value="https://www.google.com/search?q=">Google</option>
            <option value="https://www.bing.com/search?q=">Bing</option>
            <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
            <option value="https://search.brave.com/search?q=">Brave Search</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Performance Mode</label>
          <div class="preset-btns">
            <div class="preset-btn" id="perf-low" onclick="setPerfMode('LOW')">LOW</div>
            <div class="preset-btn" id="perf-balanced" onclick="setPerfMode('BALANCED')">BALANCED</div>
            <div class="preset-btn active" id="perf-high" onclick="setPerfMode('HIGH')">HIGH</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Clear Data</label>
          <button class="preset-btn" style="background: #ff4757; color: white;" id="btn-clear-history">Clear Browsing History</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    let activeTabId = null;
    let tabsMap = new Map();
    let currentSettings = {};

    // DOM Elements
    const tabStrip = document.getElementById('tab-strip');
    const omnibox = document.getElementById('omnibox');
    const ntpOverlay = document.getElementById('ntp-overlay');
    const ntpSearchInput = document.getElementById('ntp-search-input');
    const sidebar = document.getElementById('sidebar');
    const sidebarList = document.getElementById('sidebar-list');

    // API Handlers
    window.shauryaAPI.onTabCreated((tab) => {
      tabsMap.set(tab.id, tab);
      renderTabs();
    });

    window.shauryaAPI.onTabUpdated((tab) => {
      tabsMap.set(tab.id, tab);
      renderTabs();
      if (tab.id === activeTabId) {
        updateOmnibox(tab.url);
      }
    });

    window.shauryaAPI.onTabSwitched(({ id, tab }) => {
      activeTabId = id;
      renderTabs();
      updateOmnibox(tab.url);
      
      if (tab.url === 'shaurya://newtab') {
        ntpOverlay.style.display = 'flex';
      } else {
        ntpOverlay.style.display = 'none';
      }
    });

    window.shauryaAPI.onTabClosed(({ id }) => {
      tabsMap.delete(id);
      renderTabs();
    });

    function renderTabs() {
      tabStrip.innerHTML = '';
      tabsMap.forEach((tab) => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''} ${tab.isIncognito ? 'incognito' : ''}`;
        tabEl.onclick = () => window.shauryaAPI.switchTab(tab.id);

        const icon = document.createElement('img');
        icon.className = 'tab-favicon';
        icon.src = tab.favicon || (tab.isIncognito ? 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>' : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%208a99ad"><circle cx="12" cy="12" r="8"/></svg>');

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = tab.title || 'New Tab';

        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close';
        closeBtn.textContent = '✕';
        closeBtn.onclick = (e) => {
          e.stopPropagation();
          window.shauryaAPI.closeTab(tab.id);
        };

        tabEl.appendChild(icon);
        tabEl.appendChild(title);
        tabEl.appendChild(closeBtn);
        tabStrip.appendChild(tabEl);
      });
    }

    function updateOmnibox(url) {
      if (!url || url === 'shaurya://newtab') {
        omnibox.value = '';
      } else {
        omnibox.value = url;
      }
    }

    function openUrl(url) {
      if (activeTabId) {
        window.shauryaAPI.navigate(activeTabId, url);
      }
    }

    // UI Event Listeners
    document.getElementById('btn-min').onclick = () => window.shauryaAPI.minimizeWindow();
    document.getElementById('btn-max').onclick = () => window.shauryaAPI.maximizeWindow();
    document.getElementById('btn-close').onclick = () => window.shauryaAPI.closeWindow();

    document.getElementById('btn-add-tab').onclick = () => window.shauryaAPI.createTab('shaurya://newtab', false);
    document.getElementById('btn-incognito').onclick = () => window.shauryaAPI.createTab('shaurya://newtab', true);

    document.getElementById('btn-back').onclick = () => activeTabId && window.shauryaAPI.goBack(activeTabId);
    document.getElementById('btn-forward').onclick = () => activeTabId && window.shauryaAPI.goForward(activeTabId);
    document.getElementById('btn-reload').onclick = () => activeTabId && window.shauryaAPI.reload(activeTabId);
    document.getElementById('btn-home').onclick = () => activeTabId && window.shauryaAPI.navigate(activeTabId, 'shaurya://newtab');

    omnibox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && activeTabId) {
        window.shauryaAPI.navigate(activeTabId, omnibox.value);
      }
    });

    ntpSearchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && activeTabId) {
        window.shauryaAPI.navigate(activeTabId, ntpSearchInput.value);
      }
    });

    // Sidebar & Settings Toggle
    document.getElementById('btn-sidebar').onclick = async () => {
      sidebar.classList.toggle('open');
      if (sidebar.classList.contains('open')) {
        loadHistorySidebar();
      }
    };

    document.getElementById('close-sidebar').onclick = () => sidebar.classList.remove('open');

    async function loadHistorySidebar() {
      const history = await window.shauryaAPI.getHistory();
      sidebarList.innerHTML = '';
      history.slice(0, 30).forEach(item => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<span class="list-item-title">${item.title}</span>`;
        div.onclick = () => openUrl(item.url);
        sidebarList.appendChild(div);
      });
    }

    document.getElementById('btn-settings').onclick = () => {
      document.getElementById('settings-modal').classList.add('active');
    };

    document.getElementById('close-settings').onclick = () => {
      document.getElementById('settings-modal').classList.remove('active');
    };

    document.getElementById('setting-search-engine').onchange = (e) => {
      window.shauryaAPI.saveSettings({ searchEngine: e.target.value });
    };

    function setPerfMode(mode) {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`perf-${mode.toLowerCase()}`).classList.add('active');
      window.shauryaAPI.setPerformanceMode(mode);
    }

    document.getElementById('btn-clear-history').onclick = async () => {
      await window.shauryaAPI.clearHistory();
      loadHistorySidebar();
      alert('Browsing history cleared successfully.');
    };

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 't') {
        window.shauryaAPI.createTab('shaurya://newtab', false);
      } else if (e.ctrlKey && e.key === 'w' && activeTabId) {
        window.shauryaAPI.closeTab(activeTabId);
      } else if (e.ctrlKey && e.key === 'l') {
        omnibox.focus();
        omnibox.select();
      } else if (e.key === 'F12' && activeTabId) {
        window.shauryaAPI.toggleDevTools(activeTabId);
      }
    });

    // Initial settings sync
    window.shauryaAPI.getSettings().then(s => {
      currentSettings = s;
      document.getElementById('setting-search-engine').value = s.searchEngine || 'https://www.google.com/search?q=';
      setPerfMode(s.performanceMode || 'HIGH');
    });
  </script>
</body>
</html>
